# =====================================================================
#  FalixCore - Grundeinstellungen
#  Jedes Modul hat seine eigene Datei: config-<modul>.yml
#  Änderungen übernehmen: /docs reload oder /fs reload
# =====================================================================

prefix: "&8[&bXCraft&8] &7"

ui:
  # Gleiche Optik für alle Menüs und Überschriften
  line: "&8&m                    "
  filler: GRAY_STAINED_GLASS_PANE

# Module ein- oder ausschalten (true/false)
modules:
  teleport: true
  docs: true
  stats: true
  ultimate: true
  protect: true
  control: true
  guard: true
  anticheat: true
  menu: true
