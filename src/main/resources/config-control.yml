# =====================================================================
#  Modul: Control (Befehle je Gruppe ausblenden und sperren)
#  Gruppe vergeben: Rechte falixcore.group.<name> (z. B. mit LuckPerms)
#  Die erste passende Gruppe gewinnt. "*" = alle Befehle.
#  Einzelne Spieler: unter "players" eintragen, überschreibt die Gruppe.
#  Befehle ohne "/" eintragen. Änderungen: /docs reload
# =====================================================================

settings:
  hide-commands: true          # true = nicht erlaubte Befehle in der Tab-Liste ausblenden
  hide-plugin-prefix: true     # true = lange Schreibweisen wie falixcore:warp ausblenden
  default-group: spieler       # Gruppe für alle ohne Gruppenrecht
  ops-bypass: false            # false = Ops werden auch eingeschränkt (empfohlen zum Testen)

groups:
  admin:
    commands:
      - "*"
  mod:
    commands:
      - help
      - about
      - links
      - info
      - list
      - msg
      - tell
      - r
      - ban
      - unban
      - kick
      - mute
      - unmute
      - timeout
      - untimeout
      - warn
      - warnings
      - clearwarns
      - announce
      - fs
      - ultimate
      - protection
      - tpa
      - tpaccept
      - tpdeny
      - party
      - warp
      - home
      - sethome
      - delhome
  spieler:
    commands:
      - help
      - about
      - links
      - info
      - list
      - msg
      - tell
      - r
      - tpa
      - tpaccept
      - tpdeny
      - party
      - warp
      - home
      - sethome
      - delhome
      - fs
      - ultimate
      - protection

# Einzelne Spieler: Name, darunter die erlaubten Befehle
players: {}
#  Beispiel:
#  MaxMustermann:
#    - help
#    - spawn

messages:
  control-blocked: "{prefix}&cDieser Befehl ist für dich nicht verfügbar. &8(&f/{command}&8)"
