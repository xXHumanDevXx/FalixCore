# =====================================================================
#  Modul: AntiCheat (Speed, Fly, Reach, KillAura, AutoClicker)
#  Jeder Verdacht erhöht das VL (Verstoß-Level) eines Spielers.
#  VL sinkt automatisch. Bei kick-at wird gekickt, bei ban-at gebannt.
#  Änderungen: /docs reload
# =====================================================================

settings:
  log-flags: true              # jeden Verdacht in die Konsole schreiben
  alerts-to-staff: true        # Verdacht im Chat an Team (falixcore.alerts)
  ignore-ping-above: 500       # Spieler mit höherem Ping werden nicht geprüft

anticheat:
  violation-decay:
    interval-seconds: 10       # alle X Sekunden ...
    amount: 1.0                # ... sinkt das VL um diesen Wert
  kicks-before-ban: 2          # nach X AntiCheat-Kicks gibt es beim nächsten Mal einen Ban. 0 = aus
  actions:                     # Befehle, Platzhalter: {player} {check}
    kick: "kick {player} [AntiCheat] Verdacht auf {check}"
    ban: "ban {player} 7d [AntiCheat] Cheating erkannt ({check})"

checks:
  speed:
    enabled: true
    vl-per-flag: 1.0
    kick-at: 25
    ban-at: 60
    max-per-move: 0.9          # max. Blöcke pro Tick
  fly:
    enabled: true
    vl-per-flag: 1.0
    kick-at: 25
    ban-at: 60
    hover-ticks: 25            # so viele Ticks in der Luft stehen = Verdacht
    max-rise: 2.2              # max. Höhe, die man in der Luft steigen darf
  reach:
    enabled: true
    vl-per-flag: 1.0
    kick-at: 8
    ban-at: 25
    max-distance: 3.6          # Vanilla = 3.0
  killaura:
    enabled: true
    vl-per-flag: 1.5
    kick-at: 8
    ban-at: 25
    max-angle: 75              # Grad zwischen Blickrichtung und Ziel
    multi-target-ms: 90        # zwei verschiedene Ziele in weniger als X ms
  autoclicker:
    enabled: true
    vl-per-flag: 1.0
    kick-at: 6
    ban-at: 20
    max-cps: 22                # Klicks pro Sekunde

messages:
  alert: "&8[&cAC&8] &f{player} &7-> &c{check} &8(&7VL {vl}&8) &7{info}"
