# =====================================================================
#  Modul: Ultimate (XCraftUltimate-Abos)
#  Abos vergibt ein Admin: /ultimate grant <Spieler> <Tage>
#  Die Zahlung läuft außerhalb des Servers. Dieses Plugin nimmt kein Geld.
#  permissions: Rechte, die ein aktiver Abo-Spieler bekommt
#    falixcore.homes.6        = 6 Homes
#    falixcore.rank.ultimate  = Ultimate-Rang im Tab und Nametag
# =====================================================================

perks:
  name: "XCraftUltimate"
  price: "50 Cent / 2 Wochen"
  permissions:
    - "falixcore.homes.6"
    - "falixcore.rank.ultimate"

messages:
  ultimate-usage: "{prefix}&cBenutzung: &f/ultimate [info <Spieler> | grant <Spieler> <Tage> | remove <Spieler> | list]"
  ultimate-no-permission: "{prefix}&cDazu hast du keine Berechtigung."
  ultimate-player-not-found: "{prefix}&cSpieler &f{player} &cwurde nicht gefunden."
  ultimate-invalid-days: "{prefix}&cDie Tage müssen eine Zahl über 0 sein."
  ultimate-status-active: "{prefix}&aDu hast &6{name} &aaktiv bis &f{until}&a. Restlaufzeit: &f{days}&a."
  ultimate-status-inactive: "{prefix}&7Du hast kein &6{name}&7. Preis: &f{price}&7."
  ultimate-granted: "{prefix}&a{name} für &f{player} &averlängert um &f{days} Tage&a. Aktiv bis &f{until}&a."
  ultimate-granted-you: "{prefix}&aDein &6{name} &awurde um &f{days} Tage &averlängert. Aktiv bis &f{until}&a."
  ultimate-revoked: "{prefix}&e{player} hat kein &6{name} &emehr."
  ultimate-not-active: "{prefix}&c{player} hat kein aktives {name}."
  ultimate-expired: "{prefix}&7Dein &6{name} &7ist abgelaufen. Danke für deine Unterstützung!"
  ultimate-info-active: "{prefix}&f{player} &ahat {name} bis &f{until}&a."
  ultimate-info-inactive: "{prefix}&f{player} &chat kein aktives {name}."
  ultimate-list-header: "{prefix}&6Aktive Spieler &8(&f{count}&8)&6:"
  ultimate-list-entry: "&8 - &7{player} &8(&f{until}&8)"
  ultimate-list-none: "{prefix}&7Es gibt keine aktiven Spieler."
