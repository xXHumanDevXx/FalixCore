messages:
  usage: "{prefix}&cBenutzung: &f{usage}"
  no-permission: "{prefix}&cDazu hast du keine Berechtigung."
  reloaded: "{prefix}&aKonfiguration neu geladen."
  docs-not-found: "{prefix}&cDie Seite &f{page} &cexistiert nicht. Alle Seiten: &f/info"
  docs-usage: "{prefix}&cBenutzung: &f/docs <create <name> <Titel> | addline <name> <Text> | delete <name> | list | reload>"
  docs-exists: "{prefix}&cDie Seite &f{page} &cexistiert schon."
  docs-created: "{prefix}&aSeite &f{page} &aerstellt. Zeilen mit &f/docs addline {page} <Text>"
  docs-line-added: "{prefix}&aZeile zu &f{page} &ahinzugefügt."
  docs-deleted: "{prefix}&eSeite &f{page} &egelöscht."
  docs-not-editable: "{prefix}&cDie Seite &f{page} &ckann hier nicht geändert werden. Eingebaute Seiten stehen in config-docs.yml."
  docs-list-header: "{prefix}&bInfoseiten:"
  docs-list-entry: "&8 - &b{page}"
