name: FalixCore
version: 2.0.0
main: de.falixcore.FalixCore
api-version: '1.21'
description: Alle XCraft-Funktionen in einem Plugin, jedes Modul mit eigener config

commands:
  help:
    description: Hilfe anzeigen
    usage: /help
  about:
    description: Infos über den Server
    usage: /about
  links:
    description: Wichtige Links (anklickbar)
    usage: /links
  info:
    description: Infoseiten anzeigen
    usage: /info [Seite]
  docs:
    description: Infoseiten verwalten
    usage: /docs <create | addline | delete | list | reload>
    permission: falixcore.docs.admin
  tpa:
    description: Teleport-Anfrage senden
    usage: /tpa <Spieler>
  tpaccept:
    description: Teleport-Anfrage annehmen
    usage: /tpaccept
  tpdeny:
    description: Teleport-Anfrage ablehnen
    usage: /tpdeny
  tphere:
    description: Spieler zu dir bitten (Anfrage)
    usage: /tphere <Spieler>
    permission: falixcore.admin
  party:
    description: Party verwalten
    usage: /party <invite | accept | leave | kick | disband | list>
  warp:
    description: Warp-Menü oder Warp
    usage: /warp [Name]
  setwarp:
    description: Warp setzen
    usage: /setwarp <Name>
    permission: falixcore.admin
  delwarp:
    description: Warp löschen
    usage: /delwarp <Name>
    permission: falixcore.admin
  sethome:
    description: Home setzen
    usage: /sethome [Name]
  home:
    description: Home-Menü oder Home
    usage: /home [Name]
  delhome:
    description: Home löschen
    usage: /delhome <Name>
  fs:
    description: Sidebar und Bossbar verwalten
    usage: /fs <sidebar | bossbar | reload>
    aliases: [fstats]
  ultimate:
    description: Ultimate-Abo anzeigen oder verwalten
    usage: /ultimate [info | grant | remove | list]
    aliases: [ult]
  protection:
    description: Schutzblock erhalten oder Schutzbereiche verwalten
    usage: /protection [list | reload]
    aliases: [schutz]

  ban:
    description: Spieler bannen
    usage: /ban <Spieler> [Dauer] [Grund]
    permission: falixcore.mod
  unban:
    description: Ban aufheben
    usage: /unban <Spieler>
    permission: falixcore.mod
  kick:
    description: Spieler kicken
    usage: /kick <Spieler> [Grund]
    permission: falixcore.mod
  mute:
    description: Spieler muten
    usage: /mute <Spieler> [Dauer] [Grund]
    permission: falixcore.mod
  unmute:
    description: Mute aufheben
    usage: /unmute <Spieler>
    permission: falixcore.mod
  timeout:
    description: Spieler einfrieren und stummschalten
    usage: /timeout <Spieler> <Dauer> [Grund]
    permission: falixcore.mod
  untimeout:
    description: Timeout aufheben
    usage: /untimeout <Spieler>
    permission: falixcore.mod
  warn:
    description: Spieler verwarnen
    usage: /warn <Spieler> [Grund]
    permission: falixcore.mod
  warnings:
    description: Verwarnungen anzeigen
    usage: /warnings <Spieler>
    permission: falixcore.mod
  clearwarns:
    description: Verwarnungen löschen
    usage: /clearwarns <Spieler>
    permission: falixcore.mod
  announce:
    description: Ankündigung an alle senden
    usage: /announce <Text>
    permission: falixcore.mod

  menu:
    description: Zentrales Menü öffnen
    usage: /menu

  fav:
    description: Home als Favorit markieren (Ultimate, max. 4)
    usage: /fav <Home-Name>

permissions:
  falixcore.admin:
    description: Admin-Rechte (Warps setzen, /tphere, unbegrenzte Homes, /fs reload)
    default: op
  falixcore.docs.admin:
    description: Infoseiten bearbeiten und neu laden
    default: op
  falixcore.ultimate.admin:
    description: Ultimate-Abos vergeben und entfernen
    default: op
  falixcore.protect.use:
    description: Darf den Schutzblock erhalten
    default: op
  falixcore.protect.admin:
    description: Darf Schutzbereiche auflisten und die Config neu laden
    default: op
  falixcore.protect.bypass:
    description: Darf fremde Schutzbereiche abbauen
    default: op
  falixcore.rank.admin:
    description: Admin-Rang im Tab-Menü
    default: op
  falixcore.rank.mod:
    description: Mod-Rang im Tab-Menü
    default: op
  falixcore.mod:
    description: Darf Moderations-Befehle benutzen
    default: op
  falixcore.bypass:
    description: Wird von Control und Schutzbereichen nicht eingeschränkt
    default: op
  falixcore.exempt:
    description: Kann nicht bestraft werden
    default: op
  falixcore.alerts:
    description: Bekommt AntiCheat-Verdachtsmeldungen im Chat
    default: op
